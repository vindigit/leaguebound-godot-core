name: Headless simulation tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run GdUnit4 and Godot headless checks
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.7.1"
          version: "v6.2.0"
          paths: "res://tests"
          warnings-as-errors: true

      # The remaining stages run against the repository's own pinned Godot
      # build rather than a hardcoded runner path, so CI and a local or managed
      # session execute the identical binary. tools/run_checks.sh always imports
      # the project first: Godot resolves `class_name` identifiers from
      # .godot/global_script_class_cache.cfg, which only the importer writes,
      # and without it every typed script fails to parse under the
      # warnings-as-errors settings in project.godot.
      - name: Install pinned Godot 4.7.1
        run: tools/install_godot.sh

      - name: Parse-check every script under warnings-as-errors
        run: tools/run_checks.sh parse

      - name: Run project-owned acceptance entry point
        run: tools/run_checks.sh acceptance

      # Stage 3 gate item 7: a fixed-seed smoke run completes without invariant
      # violations. The statistical bands it prints are diagnostic only until
      # the balance pass; the tool fails on invariants, never on a band.
      - name: Run simulation smoke diagnostics
        run: tools/run_checks.sh smoke

      # Gate B1: completed builds must satisfy the owner-locked BALANCE_SPEC
      # §7.3.2 bands. The harness fails the build if they do not, so a balance
      # change that silently moves the distribution cannot merge.
      - name: Run Builder calibration harness
        run: tools/run_checks.sh calibration

      - name: Upload Builder calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-calibration-report
          path: reports/builder_calibration.json
          if-no-files-found: warn
