name: Pull request gate

# The fast, always-on layer. Everything here must finish in ordinary PR time, so
# it covers structure, determinism, reconciliation, and a *small* deterministic
# calibration smoke run with broad control limits. It deliberately does not
# certify a statistical band: `BALANCE_SPEC.md` §27.1 sets the certifying sample
# sizes and no run of this length reaches them. The nightly and pre-release
# workflows own that.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run GdUnit4 and Godot headless checks
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.7.1"
          version: "v6.2.0"
          paths: "res://tests"
          warnings-as-errors: true

      # The parse gate needs the global class cache: without it every reference
      # to a `class_name` reports as a compile failure. The import pass builds
      # it, and running it as its own step means a failure here is legible as an
      # import problem rather than as 150 phantom parse errors.
      - name: Build the global class cache
        run: /home/runner/godot-linux/godot --headless --path . --import

      # The gate exits 0 when every script compiles, 1 when one does not, and 2
      # when it cannot prove it is working. The step asserts the status
      # explicitly rather than relying on the printed count: this gate once
      # reported "0 failure(s)" while walking straight past a syntax error, and
      # a count is exactly the thing that lied.
      - name: Parse-check every script under warnings-as-errors
        run: |
          set +e
          /home/runner/godot-linux/godot --headless --path . \
            --script res://tools/parse_check.gd
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::parse_check exited ${status} (1 = a script did not compile, 2 = the gate could not verify itself)"
            exit "$status"
          fi

      # Structural invariants, reconciliation, determinism, and the committed
      # golden fixtures. A golden change requires an explicit engine or balance
      # version change and review, so a diff here is a deliberate act.
      - name: Run project-owned acceptance entry point
        run: /home/runner/godot-linux/godot --headless --path . --script res://tests/run_all.gd

      - name: Run simulation smoke diagnostics
        run: /home/runner/godot-linux/godot --headless --path . --script res://tools/simulation_smoke.gd

      # Gate B1: completed builds must satisfy the owner-locked BALANCE_SPEC
      # §7.3.2 bands.
      - name: Run Builder smoke portfolio
        run: /home/runner/godot-linux/godot --headless --path . --script res://tools/builder_calibration_harness.gd

      # Gate B1 / §29.2 item 3: all twenty attributes monotonic with a
      # meaningful observable effect, and no IQ rating substituting for a
      # primary skill. The capability layer is exact, so this is fast and is a
      # real gate rather than a smoke check.
      - name: Run attribute sensitivity suite
        run: >-
          /home/runner/godot-linux/godot --headless --path . --script
          res://calibration/runners/run_attribute_sensitivity.gd --
          --resolutions=100000 --label=pr

      # A small deterministic calibration run with broad control limits. It
      # exists to catch a structural regression — an event family that stopped
      # firing, a possession count that collapsed — not to certify a band.
      - name: Run calibration smoke
        run: >-
          /home/runner/godot-linux/godot --headless --path . --script
          res://calibration/runners/run_calibration_smoke.gd -- --games=6 --label=pr

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-reports
          path: reports/
          if-no-files-found: warn
